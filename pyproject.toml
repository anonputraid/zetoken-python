[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zetoken"
version = "1.1.0"
authors = [
  { name="anonputraid", email="admin@getbitlab.com" },
]
description = "A modern cryptographic token generator and verifier."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "cryptography>=39.0.0",
    "python-dotenv>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/anonputraid/zetoken-python"
"Bug Tracker" = "https://github.com/anonputraid/zetoken-python/issues"